name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format

      - name: Check types
        run: pnpm run check

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test
        env:
          REDIS_URL: redis://127.0.0.1:6379

      - name: Build
        run: pnpm run build

      - name: Check the budget command
        run: node dist/cli.js --help

      - name: Check the client size
        run: pnpm run size

      - name: Build the docs site
        run: pnpm run site

  fuzz:
    name: Property tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Property tests
        run: pnpm run fuzz
        env:
          FUZZ_RUNS: ${{ github.event_name == 'schedule' && '50000' || '5000' }}

  browser:
    name: Browser (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oldest supported
            install: svelte@5.57.0 @sveltejs/kit@3.0.0
            async: "0"
            plugin: "1"
          - name: newest
            install: svelte@latest @sveltejs/kit@latest
            async: "0"
            plugin: "1"
          - name: async mode
            install: ""
            async: "1"
            plugin: "1"
          - name: without the Vite plugin
            install: ""
            async: "0"
            plugin: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use the matrix versions
        if: matrix.install != ''
        run: pnpm add -D $MATRIX_INSTALL
        env:
          MATRIX_INSTALL: ${{ matrix.install }}

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Unit tests
        run: pnpm run test

      - name: Browser tests
        run: pnpm run test:e2e
        env:
          FIXTURE_ASYNC: ${{ matrix.async }}
          FIXTURE_PLUGIN: ${{ matrix.plugin }}

  workers:
    name: Cloudflare Workers (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no store
            store: ""
          - name: R2 store
            store: r2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests on workerd
        run: pnpm run test:workers
        env:
          FIXTURE_STORE: ${{ matrix.store }}
